name: Link check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths: ["**/*.md"]

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --exclude '^https://(www\.)?(linkedin|twitter)\.com'
            './**/*.md'
          # Broken links block scheduled runs but never a content PR on their own.
          fail: ${{ github.event_name != 'pull_request' }}

      - name: Open an issue for broken links (scheduled runs only)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: documentation, automated
